# Automated tests (synthetic PKGs generated by tests/pkgbuilder.py; no game is needed).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -r packaging/appimage/requirements-app.txt -e ".[test]"
      - name: Lint and formatting
        run: ruff check . && ruff format --check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
      - name: GUI stress (repeat to catch races)
        env:
          QT_QPA_PLATFORM: offscreen
        run: for i in $(seq 10); do pytest -q tests/test_gui.py tests/test_threads.py || exit 1; done
