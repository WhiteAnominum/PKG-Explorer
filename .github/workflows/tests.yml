# Testes automáticos (PKGs sintéticos gerados em tests/pkgbuilder.py; nenhum jogo é necessário).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema para o Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar
        run: pip install -r packaging/appimage/requirements-app.txt -e ".[test]"
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
