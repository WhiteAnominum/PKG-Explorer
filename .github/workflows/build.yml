# Gera o AppImage e o Flatpak. Em tags v* (ex.: v0.1.0), publica os dois numa Release.
# Também pode ser rodado à mão (aba Actions > Build > Run workflow), sem publicar nada.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Só leitura por padrão; a etapa que publica a Release pede escrita.
# Ações de terceiros fixadas pelo hash do commit (a versão fica no comentário).
permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  appimage:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      # O appimagetool também é um AppImage; sem FUSE no runner, ele se extrai e roda.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: dist/PKG-Explorer-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.WhiteAnominum.PKGExplorer.yml
          flatpak build-bundle repo PKG-Explorer.flatpak io.github.WhiteAnominum.PKGExplorer \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak
          path: PKG-Explorer.flatpak
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum PKG-Explorer-x86_64.AppImage PKG-Explorer.flatpak > SHA256SUMS
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PKG Explorer ${{ steps.version.outputs.version }}
          files: |
            PKG-Explorer-x86_64.AppImage
            PKG-Explorer.flatpak
            SHA256SUMS
          generate_release_notes: true
