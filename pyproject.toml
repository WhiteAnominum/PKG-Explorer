[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-explorer"
dynamic = ["version"]
description = "Navegador gráfico de arquivos .pkg de PS4: veja o conteúdo e extraia só o que quiser"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "PySide6-Essentials>=6.5",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "ruff==0.17.3"]

[project.urls]
Homepage = "https://github.com/WhiteAnominum/PKG-Explorer"

[project.scripts]
pkg-explorer-cli = "pkg_explorer.cli:main"

[project.gui-scripts]
pkg-explorer = "pkg_explorer.gui:main"

[tool.setuptools]
packages = ["pkg_explorer", "pkg_explorer.data"]

[tool.setuptools.package-data]
"pkg_explorer.data" = ["*.svg", "*.xml"]

[tool.setuptools.dynamic]
version = { attr = "pkg_explorer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["pkg_explorer/keys.py", "pkg_explorer/entry_names.py"]  # generated

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One translation per line reads better than strings split across lines.
"pkg_explorer/i18n.py" = ["E501"]
